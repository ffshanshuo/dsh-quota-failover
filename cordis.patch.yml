# dsh-quota-failover bundle patch — inserts the plugin row into a profile's composition.
# This placeholder is rewritten by install.mjs at install time so the row points at the
# copy inside your own profile (`file:<profile>/node_modules/dsh-quota-failover/lib/index.js`).
# Do not hand-edit the installed copy.
- insert:
    - id: dsh-quota-failover
      name: "file:<PROFILE>/node_modules/dsh-quota-failover/lib/index.js"
